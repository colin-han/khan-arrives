  .skill .bubble .msg{font-size:25px; color:#1c1a17; margin-top:4px;}

  .chart{flex:1; display:flex; align-items:center; margin-top:4px;}

  .meter.eat .fill{width:92%; background:#d4441c;}

  .meter.eat .note{color:#d4441c;}

  .sig .theme{font-family:"LXGW Bright","PingFang SC",sans-serif; font-weight:400; font-size:21px; color:#9a9286;}
